services:
  - type: web
    name: aruu-beauty-meta-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: false
      - key: APP_PUBLIC_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: META_GRAPH_API_VERSION
        value: v23.0
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
      - key: WHATSAPP_APP_SECRET
        sync: false
      - key: INSTAGRAM_PAGE_ACCESS_TOKEN
        sync: false
      - key: INSTAGRAM_USER_ID
        sync: false
      - key: INSTAGRAM_VERIFY_TOKEN
        sync: false
      - key: INSTAGRAM_APP_SECRET
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: GROQ_TEMPERATURE
        value: 0.1
      - key: GROQ_MAX_COMPLETION_TOKENS
        value: 1024
      - key: GROQ_REASONING_EFFORT
        value: low
      - key: GROQ_DISABLE_SSL_VERIFY
        value: false
      - key: API_KEY
        generateValue: true
